<div class="container mt-4">
  <h1 class="mb-4">Posts</h1>
  <div class="list-group mb-4">
    @for (post of posts; track post.id) {
      <div class="list-group-item">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <a [routerLink]="['/posts', post.slug]" class="fw-bold text-decoration-none">{{ post.title }}</a>
            <div><small class="text-muted">{{ post.author }} | {{ post.publishedAt | date:'mediumDate' }}</small></div>
            <em class="text-muted">{{ post.tags }}</em>
          </div>
          <button
            type="button"
            class="btn btn-sm like-button"
            [class.liked]="post.likedByCurrentUser"
            (click)="toggleLike(post)">
            {{ post.likedByCurrentUser ? '♥' : '♡' }} {{ post.likeCount }}
          </button>
        </div>
      </div>
    }
  </div>

  @if (totalPages > 1) {
    <p class="pagination-info">Sayfa {{ currentPage }} / {{ totalPages }} — toplam {{ totalCount }} yazı</p>
    <nav class="pagination">
      @for (p of pageNumbers; track p) {
        <button type="button" class="btn btn-sm btn-outline-secondary" [class.active]="p === currentPage" [disabled]="p === currentPage" (click)="goToPage(p)">{{ p }}</button>
      }
    </nav>
  }
</div>
